name: Release

# For every vX.Y.Z tag: the standalone Windows build, attached to the tag's GitHub
# release, where install.ps1 downloads it on machines without Python. Run by hand, it
# only builds and checks, keeping the archive as an artifact of the run.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: .\tools\build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: pense-bete-windows
          path: dist/pense-bete-windows.zip
      # A tag moved to another commit gets a fresh release: the old one would have
      # turned into a draft, which the installer cannot see.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete $env:TAG --yes 2>$null
          gh release create $env:TAG dist/pense-bete-windows.zip --title $env:TAG --notes-from-tag --verify-tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
