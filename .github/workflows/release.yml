name: Release

# For every vX.Y.Z tag: the standalone builds for Windows and Linux, attached to the
# tag's GitHub release, where the installers download them. The release is created once
# both are built, so that it never shows without them. Run by hand, it only builds and
# checks, keeping the archives as artifacts of the run.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: .\tools\build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: pense-bete-windows
          path: dist/pense-bete-windows.zip

  linux-build:
    # The oldest Ubuntu offered: the build runs on systems with this glibc or a newer one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Qt's X11 plugin needs libxcb-cursor0: present here, the build carries it.
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon0
      - run: python -m pip install pyinstaller -r requirements.txt
      - run: tools/build_linux.sh "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: pense-bete-linux
          path: dist/pense-bete-linux.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-build, linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # --notes-from-tag reads the annotated tag
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A tag moved to another commit gets a fresh release: the old one would have
      # turned into a draft, which the installers cannot see.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/pense-bete-windows.zip dist/pense-bete-linux.tar.gz \
            --title "$TAG" --notes-from-tag --verify-tag
